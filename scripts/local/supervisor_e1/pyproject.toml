[project]
name = "hekate-supervisor-e1"
version = "0.1.0"
description = "Test-only supervisor/API precondition experiment (plan 023 E1a). Not production code."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]
# Optional: the read-only planning-role runtime (e1/role_worker.py). Not needed by any other e1 module.
roles = [
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"

[tool.uv]
package = false
